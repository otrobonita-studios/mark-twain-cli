[package]
name = "mark-twain-cli"
version = "0.1.0"
edition = "2024"
description = "A CLI to run semantic search and style analysis against Mark Twain's writing via a vector database API"
license = "Apache-2.0"
repository = "https://github.com/otrobonita-studios/mark-twain-cli"
keywords = ["mark-twain", "cli", "nlp", "semantic-search", "literary"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dialoguer = "0.11"
indicatif = "0.17"
colored = "2.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
