name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x86_64
            extension: tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux
            arch: aarch64
            extension: tar.gz
          # Built on the Apple Silicon runner rather than macos-13: GitHub has
          # retired the Intel macOS image, so that label no longer resolves to
          # any runner and the job queues forever. Xcode ships both SDKs, so
          # cross-compiling to x86_64 from arm64 needs no extra toolchain.
          - runner: macos-latest
            target: x86_64-apple-darwin
            platform: macos
            arch: x86_64
            extension: tar.gz
          - runner: macos-latest
            target: aarch64-apple-darwin
            platform: macos
            arch: aarch64
            extension: tar.gz
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            arch: x86_64
            extension: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      # The archive name is a contract with install.sh, which builds it as
      # mark-twain-cli-<tag>-<platform>-<arch>.<ext>. Changing it here breaks
      # every documented install command.
      - name: Package (tar.gz)
        if: matrix.extension == 'tar.gz'
        run: |
          ASSET="mark-twain-cli-${GITHUB_REF_NAME}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz"
          tar -czf "$ASSET" -C "target/${{ matrix.target }}/release" mark-twain-cli
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Package (zip)
        if: matrix.extension == 'zip'
        shell: pwsh
        run: |
          $asset = "mark-twain-cli-$env:GITHUB_REF_NAME-${{ matrix.platform }}-${{ matrix.arch }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/mark-twain-cli.exe" -DestinationPath $asset
          "ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # install.sh refuses to install without this file, and verifies the
      # downloaded archive against it before making anything executable.
      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: |
          sha256sum mark-twain-cli-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: artifacts
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            mark-twain-cli-* SHA256SUMS
